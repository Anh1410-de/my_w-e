
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vợ yêu ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #ffe4ec,
                #fff0f5,
                #ffd6e7
            );

            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 30px 15px;
        }

        .container {
            background: white;
            max-width: 650px;
            width: 100%;
            padding: 30px;
            border-radius: 25px;
            text-align: center;

            box-shadow: 0 10px 40px rgba(255, 105, 150, 0.2);

            position: relative;
            z-index: 2;
        }

        h1 {
            color: #ff4f87;
            font-size: 38px;
            margin-bottom: 20px;
        }

        .photo {
            width: 100%;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .message {
            margin-top: 25px;
            color: #e75480;
            font-size: 19px;
            line-height: 1.8;
        }

        .heart {
            font-size: 35px;
            margin-top: 15px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        .floating-heart {
            position: fixed;
            bottom: -50px;
            color: #ff4f87;
            font-size: 25px;
            animation: floatUp 6s linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 30px;
            }

            .container {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Vợ yêu ❤️</h1>

        <img
            src="vo-yeu.png"
            alt="Kỷ niệm mùa đông"
            class="photo"
        >

        <div class="message">
            Cảm ơn vì đã xuất hiện trong cuộc sống của anh.
            <br>
            Mong rằng chúng ta sẽ có thật nhiều
            kỷ niệm đẹp bên nhau.
            <br>
            Yêu em thật nhiều! 💗
        </div>

        <div class="heart">
            ❤️ 💕 ❤️
        </div>

    </div>

    <script>
        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "floating-heart";

            const hearts = ["❤️", "💕", "💗", "💖", "💘"];

            heart.innerHTML =
                hearts[Math.floor(Math.random() * hearts.length)];

            heart.style.left = Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (4 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createHeart, 500);
    </script>

</body>
</html>
